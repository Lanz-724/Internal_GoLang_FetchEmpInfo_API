basePath: /
definitions:
  main.EmpInfo:
    properties:
      BioID:
        type: string
      Dept:
        type: string
      IdNo:
        type: string
      Name:
        type: string
    type: object
  main.Employee:
    properties:
      fname:
        type: string
      id:
        type: integer
      lname:
        type: string
    type: object
host: localhost:9090
info:
  contact: {}
  description: My first Go API
  title: My Go API
  version: "1.0"
paths:
  /empinfo:
    get:
      description: Returns employees with department and bio info
      parameters:
      - default: ""
        description: Department name to filter by
        in: query
        name: Dept
        type: string
      - default: ""
        description: Filter by Emp Name to filter by
        in: query
        name: FilterName
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.EmpInfo'
            type: array
      summary: Get employee info
      tags:
      - employees
  /users:
    get:
      description: Returns a list of employees
      parameters:
      - default: 20
        description: Number of records to return
        in: query
        name: limit
        type: integer
      - default: 0
        description: Number of records to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.Employee'
            type: array
      summary: Get employees
      tags:
      - employees
swagger: "2.0"
